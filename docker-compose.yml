services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jorip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-jorip}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jorip} -d ${POSTGRES_DB:-jorip}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 256m

  n8n:
    image: docker.n8n.io/n8nio/n8n:1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # n8n's own tables live in the same Postgres cluster, separate concern
      # from the app schema created by db/init.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-jorip}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-jorip}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY missing — openssl rand -hex 32}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # A tunnel URL is https; n8n must not strip or rewrite it.
      N8N_SECURE_COOKIE: "false"

      GENERIC_TIMEZONE: Asia/Dhaka
      TZ: Asia/Dhaka
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      # Keeps the container inside a 2 GB laptop budget.
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 5
      NODE_OPTIONS: --max-old-space-size=768

      # Read by the workflow through $env so no key is ever pasted into a node
      # that ends up in an exported JSON file.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_ROUTE: ${GEMINI_MODEL_ROUTE:-gemini-3.1-flash-lite}
      GEMINI_MODEL_REPLY: ${GEMINI_MODEL_REPLY:-gemini-3-flash-preview}
      GEMINI_MODEL_HEAVY: ${GEMINI_MODEL_HEAVY:-gemini-3.8-flash}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-400}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-0}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      GEMINI_EMBED_DIMS: ${GEMINI_EMBED_DIMS:-768}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # The brain, by service name. n8n never holds the Gemini key on this path —
      # it asks the brain for a decision and gets JSON back.
      JORIP_BRAIN_URL: ${JORIP_BRAIN_URL:-http://brain:8788}
      JORIP_SHARED_SECRET: ${JORIP_SHARED_SECRET:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./secrets:/secrets:ro
    ports:
      - "127.0.0.1:5678:5678"
    mem_limit: 1100m

  # The agent's judgement, as a long-lived process. Same modules as the Vercel
  # function — this service adds HTTP routes, not logic — so the WhatsApp path and
  # the web front door cannot drift apart. n8n's Code node runs in a sandbox where
  # importing these files is not reliable, so the crypto and the enum checks live
  # here instead of in a workflow node.
  brain:
    image: node:22-slim
    restart: unless-stopped
    working_dir: /srv/jorip
    # No npm install: the brain uses only Node built-ins and local modules, so the
    # container has nothing to pull at start and the cold boot is a fork, not a build.
    command: ["node", "scripts/brain-server.mjs"]
    environment:
      JORIP_BRAIN_HOST: 0.0.0.0
      JORIP_BRAIN_PORT: 8788
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_ROUTE: ${GEMINI_MODEL_ROUTE:-gemini-3.1-flash-lite}
      GEMINI_MODEL_REPLY: ${GEMINI_MODEL_REPLY:-gemini-3-flash-preview}
      GEMINI_MODEL_HEAVY: ${GEMINI_MODEL_HEAVY:-gemini-3.8-flash}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-400}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-0}
      JORIP_MODEL_TIMEOUT_MS: ${JORIP_MODEL_TIMEOUT_MS:-12000}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      JORIP_SHARED_SECRET: ${JORIP_SHARED_SECRET:-}
      # The edge's only outbound call: verified, normalised messages go to n8n's webhook and
      # n8n owns the database, the model turn and the send. If this is unreachable the brain
      # answers 502 so Meta retries, rather than acknowledging a message nobody stored.
      JORIP_PIPELINE_URL: ${JORIP_PIPELINE_URL:-http://n8n:5678/webhook/jorip-pipeline}
      JORIP_HANDOFF_TIMEOUT_MS: ${JORIP_HANDOFF_TIMEOUT_MS:-8000}
    volumes:
      - ./core:/srv/jorip/core:ro
      - ./scripts:/srv/jorip/scripts:ro
      - ./api:/srv/jorip/api:ro
      - ./web:/srv/jorip/web:ro
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    mem_limit: 192m

volumes:
  pgdata:
  n8n_data:
